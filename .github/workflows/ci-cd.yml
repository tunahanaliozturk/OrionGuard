name: CI/CD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  release:
    types: [ published ]

# Least privilege: every job gets a read-only token unless it asks for more. Only the publish job
# widens it (packages: write), and only for itself.
permissions:
  contents: read

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  SOLUTION_PATH: Moongazing.OrionGuard.sln

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        dotnet-version: ['8.0.x', '9.0.x', '10.0.x']

    steps:
      # Actions are pinned to a full commit SHA (a tag can be moved to other code); the trailing
      # comment names the release the SHA belongs to.
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Nothing in this job pushes to the repository, so the token is not left in .git/config for
          # the build (restore and MSBuild run third-party package code) to read.
          persist-credentials: false

      - name: Setup .NET ${{ matrix.dotnet-version }}
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: ${{ matrix.dotnet-version }}

      - name: Restore dependencies
        run: dotnet restore ${{ env.SOLUTION_PATH }}

      - name: Build
        run: dotnet build ${{ env.SOLUTION_PATH }} --no-restore --configuration Release

      - name: Test
        run: dotnet test ${{ env.SOLUTION_PATH }} --no-restore --configuration Release --verbosity normal

  publish:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    permissions:
      packages: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore ${{ env.SOLUTION_PATH }}

      - name: Build
        # ContinuousIntegrationBuild makes the shipped assemblies and PDBs reproducible: source paths are
        # mapped to /_/ instead of the runner's checkout path, and Source Link records the commit.
        run: dotnet build ${{ env.SOLUTION_PATH }} --no-restore --configuration Release -p:ContinuousIntegrationBuild=true

      - name: Pack All Projects
        # Packs the solution rather than an enumerated list of projects. Every non-shipping
        # project (tests, sample, demo, benchmarks, the AOT probe) sets IsPackable=false, so this
        # produces exactly the src/ packages - and a newly added sub-package ships automatically
        # instead of being left out of the release until someone notices it missing from NuGet.
        # Each package carries its own <Version>, so mixed versions (e.g. the Migration tool)
        # pack correctly.
        run: dotnet pack ${{ env.SOLUTION_PATH }} --no-build --configuration Release -o ./nupkgs -p:ContinuousIntegrationBuild=true

      - name: Pack the template pack
        # OrionGuard.Templates lives outside the solution (a template pack compiles nothing, and its
        # content must not be built as part of the build above), so the solution pack never reaches it.
        # It is packed here into the same folder, which is what both push steps glob over. No --no-build:
        # the project was not part of the Build step.
        run: dotnet pack templates/Moongazing.OrionGuard.Templates.csproj --configuration Release -o ./nupkgs -p:ContinuousIntegrationBuild=true

      - name: Verify every packable project produced a package
        run: |
          # The packable projects under src/, plus the out-of-solution template pack.
          expected=$(( $(find src -name '*.csproj' -exec grep -L '<IsPackable>false' {} + | wc -l) + 1 ))
          actual=$(find ./nupkgs -name '*.nupkg' -not -name '*.symbols.nupkg' | wc -l)
          echo "Packable src projects + template pack: $expected"
          echo "Packages produced:                     $actual"
          find ./nupkgs -name '*.nupkg' -printf '  %f\n' | sort
          if [ "$expected" -ne "$actual" ]; then
            echo "::error::Expected $expected packages but produced $actual. Refusing to publish a partial set."
            exit 1
          fi

      - name: Push to NuGet.org
        # The key comes in through the environment, so it never appears in the rendered script.
        env:
          NUGET_API_KEY: ${{ secrets.NUGET }}
        run: dotnet nuget push "./nupkgs/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Push to GitHub Packages
        # GitHub Packages does not honour --skip-duplicate like nuget.org: it returns a non-zero
        # exit on an already-published version, which would fail the whole release run on a
        # re-publish even though the nuget.org push above (the gating one) succeeded. Rather than
        # blanket `continue-on-error` - which would also hide a real auth/connectivity/upload
        # failure and let the mirror silently drift - tolerate ONLY the duplicate rejection: any
        # error line that is not an "already exists" conflict still fails the step.
        env:
          GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          dotnet nuget add source --username "$REPOSITORY_OWNER" --password "$GITHUB_PACKAGES_TOKEN" --store-password-in-clear-text --name github "https://nuget.pkg.github.com/$REPOSITORY_OWNER/index.json"
          # Pushed one package at a time on purpose. GitHub Packages answers an already-published
          # version with 409 instead of honouring --skip-duplicate, and dotnet nuget push stops at the
          # first failure in a batch - so a retry of a partly-published release would abort on package
          # one and never attempt the rest, while a batch-level "it was only duplicates" check called
          # that success and left the mirror permanently incomplete. Per package, a duplicate is
          # tolerated and anything else fails the job, after every package has had its turn.
          failed=0
          for pkg in ./nupkgs/*.nupkg; do
            set +e
            output=$(dotnet nuget push "$pkg" --source github --api-key "$GITHUB_PACKAGES_TOKEN" --skip-duplicate --timeout 900 2>&1)
            code=$?
            set -e
            if [ $code -eq 0 ]; then
              continue
            fi
            if echo "$output" | grep -qiE 'already exists|already been pushed|409 \(Conflict\)'; then
              echo "already published, skipping: $(basename "$pkg")"
            else
              echo "$output"
              echo "::error::GitHub Packages push failed for $(basename "$pkg") (exit code $code)."
              failed=1
            fi
          done
          if [ "$failed" -ne 0 ]; then
            exit 1
          fi
