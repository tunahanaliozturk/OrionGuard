<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="795" viewBox="0 0 1200 795">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-fail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <style>
    text { font-family: "Segoe UI", Inter, "Helvetica Neue", Arial, sans-serif; fill: #1e1b4b; }
    .title { font-size: 24px; font-weight: 700; }
    .subtitle { font-size: 14px; fill: #475569; }
    .label { font-size: 15px; font-weight: 600; }
    .small { font-size: 12.5px; fill: #475569; }
    .code { font-family: "Cascadia Code", Consolas, "SF Mono", monospace; font-size: 13px; fill: #3730a3; }
    .edge { font-size: 12.5px; fill: #334155; }
    .step { fill: #eef2ff; stroke: #4f46e5; stroke-width: 2; }
    .ext { fill: #f0f9ff; stroke: #0284c7; stroke-width: 2; }
    .ok { fill: #ecfdf5; stroke: #059669; stroke-width: 2; }
    .fail { fill: #fef2f2; stroke: #dc2626; stroke-width: 2; }
    .decision { fill: #fffbeb; stroke: #d97706; stroke-width: 2; }
    .note { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; stroke-dasharray: 4 3; }
    .lane { stroke: #cbd5e1; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .flow { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#arrow); }
    .flow.alt { stroke: #dc2626; stroke-dasharray: 6 4; marker-end: url(#arrow-fail); }
    .flow.back { stroke-dasharray: 6 4; }
    .badge { fill: #4f46e5; }
    .badge-text { font-size: 12px; font-weight: 700; fill: #ffffff; }
  </style>

  <rect width="1200" height="795" fill="#ffffff"/>

  <text class="title" x="40" y="52">OrionGuard.AspNetCore - validating a Minimal API request</text>
  <text class="subtitle" x="40" y="78">WithValidation&lt;T&gt;() adds OrionGuardEndpointFilter&lt;T&gt;: an invalid body never reaches the handler and is answered with ProblemDetails.</text>

  <!-- alt frames (drawn first, behind the lifelines) -->
  <rect class="note" x="30" y="425" width="1140" height="110" rx="10"/>
  <text class="small" x="44" y="445" style="font-weight: 700">valid</text>
  <rect class="note" x="30" y="550" width="1140" height="120" rx="10"/>
  <text class="small" x="44" y="570" style="font-weight: 700; fill: #dc2626">invalid</text>

  <!-- lifelines -->
  <path class="lane" d="M110,166 L110,680"/>
  <path class="lane" d="M340,166 L340,680"/>
  <path class="lane" d="M600,166 L600,680"/>
  <path class="lane" d="M870,166 L870,680"/>
  <path class="lane" d="M1080,166 L1080,680"/>

  <!-- participants -->
  <rect class="ext" x="40" y="110" width="140" height="56" rx="12"/>
  <text class="label" x="110" y="144" text-anchor="middle">Client</text>
  <rect class="ext" x="240" y="110" width="200" height="56" rx="12"/>
  <text class="label" x="340" y="135" text-anchor="middle">ASP.NET Core</text>
  <text class="small" x="340" y="154" text-anchor="middle">Minimal API endpoint</text>
  <rect class="step" x="470" y="110" width="260" height="56" rx="12"/>
  <text class="code" x="600" y="143" text-anchor="middle">OrionGuardEndpointFilter&lt;T&gt;</text>
  <rect class="step" x="770" y="110" width="200" height="56" rx="12"/>
  <text class="code" x="870" y="143" text-anchor="middle">IValidator&lt;T&gt;</text>
  <rect class="ext" x="1000" y="110" width="160" height="56" rx="12"/>
  <text class="label" x="1080" y="144" text-anchor="middle">Handler</text>

  <!-- 1 request -->
  <path class="flow" d="M110,220 L338,220"/>
  <circle class="badge" cx="130" cy="204" r="11"/>
  <text class="badge-text" x="130" y="208" text-anchor="middle">1</text>
  <text class="edge" x="148" y="209">POST /api/users</text>

  <!-- 2 binding + filter -->
  <path class="flow" d="M340,275 L598,275"/>
  <circle class="badge" cx="360" cy="259" r="11"/>
  <text class="badge-text" x="360" y="263" text-anchor="middle">2</text>
  <text class="edge" x="378" y="264">binds the body, runs the filter</text>

  <!-- 3 validate -->
  <path class="flow" d="M600,330 L868,330"/>
  <circle class="badge" cx="620" cy="314" r="11"/>
  <text class="badge-text" x="620" y="318" text-anchor="middle">3</text>
  <text class="code" x="638" y="319">ValidateAsync(request, ct)</text>
  <text class="small" x="638" y="350">ct = HttpContext.RequestAborted</text>

  <!-- 4 result -->
  <path class="flow back" d="M870,385 L602,385"/>
  <circle class="badge" cx="850" cy="369" r="11"/>
  <text class="badge-text" x="850" y="373" text-anchor="middle">4</text>
  <text class="code" x="832" y="374" text-anchor="end">GuardResult</text>

  <!-- valid: 5 next, 6 response -->
  <path class="flow" d="M600,470 L1078,470"/>
  <circle class="badge" cx="620" cy="454" r="11"/>
  <text class="badge-text" x="620" y="458" text-anchor="middle">5</text>
  <text class="code" x="638" y="459">next(context)</text>
  <path class="flow back" d="M1080,515 L112,515"/>
  <circle class="badge" cx="1060" cy="499" r="11"/>
  <text class="badge-text" x="1060" y="503" text-anchor="middle">6</text>
  <text class="edge" x="1042" y="504" text-anchor="end">the handler's response (2xx)</text>

  <!-- invalid: 5 problem -->
  <path class="flow alt" d="M600,620 L112,620"/>
  <circle class="badge" cx="580" cy="604" r="11" style="fill: #dc2626"/>
  <text class="badge-text" x="580" y="608" text-anchor="middle">5</text>
  <text class="code" x="562" y="609" text-anchor="end">Results.Problem(ValidationProblemDetails)</text>
  <text class="small" x="356" y="645" text-anchor="middle">status = SuggestedHttpStatusCode ?? DefaultStatusCode (422)</text>
  <text class="small" x="620" y="625">handler is not called</text>

  <!-- notes -->
  <rect class="note" x="40" y="695" width="1120" height="70" rx="10"/>
  <text class="small" x="60" y="722">No IValidator&lt;T&gt; registered, or no argument of type T: the filter calls next(context) and the request is not validated.</text>
  <text class="small" x="60" y="744">The filter resolves one IValidator&lt;T&gt;. UseProblemDetails = false answers Results.Json(result.ToErrorDictionary(), statusCode) instead.</text>
</svg>
