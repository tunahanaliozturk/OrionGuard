<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-fail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <style>
    text { font-family: "Segoe UI", Inter, "Helvetica Neue", Arial, sans-serif; fill: #1e1b4b; }
    .title { font-size: 24px; font-weight: 700; }
    .subtitle { font-size: 14px; fill: #475569; }
    .label { font-size: 15px; font-weight: 600; }
    .small { font-size: 12.5px; fill: #475569; }
    .code { font-family: "Cascadia Code", Consolas, "SF Mono", monospace; font-size: 13px; fill: #3730a3; }
    .edge { font-size: 12.5px; fill: #334155; }
    .step { fill: #eef2ff; stroke: #4f46e5; stroke-width: 2; }
    .ext { fill: #f0f9ff; stroke: #0284c7; stroke-width: 2; }
    .ok { fill: #ecfdf5; stroke: #059669; stroke-width: 2; }
    .fail { fill: #fef2f2; stroke: #dc2626; stroke-width: 2; }
    .decision { fill: #fffbeb; stroke: #d97706; stroke-width: 2; }
    .note { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; stroke-dasharray: 4 3; }
    .lane { stroke: #cbd5e1; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .flow { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#arrow); }
    .flow.alt { stroke: #dc2626; stroke-dasharray: 6 4; marker-end: url(#arrow-fail); }
    .flow.back { stroke-dasharray: 6 4; }
    .badge { fill: #4f46e5; }
    .badge-text { font-size: 12px; font-weight: 700; fill: #ffffff; }
  </style>

  <rect width="1200" height="680" fill="#ffffff"/>

  <text class="title" x="40" y="52">OrionGuard - one core package, integrations around it</text>
  <text class="subtitle" x="40" y="78">Guards, validators and DDD primitives live in OrionGuard. Integration packages build on it; the tooling packages run at build time or in tests.</text>

  <!-- the app -->
  <rect class="ext" x="40" y="250" width="200" height="100" rx="14"/>
  <text class="label" x="140" y="285" text-anchor="middle">Your app</text>
  <text class="small" x="140" y="309" text-anchor="middle">guards in the domain,</text>
  <text class="small" x="140" y="329" text-anchor="middle">validators at the edges</text>

  <path class="flow" d="M240,300 L298,300"/>

  <!-- core -->
  <rect class="step" x="300" y="150" width="280" height="300" rx="14"/>
  <text class="label" x="440" y="182" text-anchor="middle">OrionGuard</text>
  <text class="code" x="440" y="216" text-anchor="middle">Ensure.That / Guard / FastGuard</text>
  <text class="code" x="440" y="242" text-anchor="middle">AbstractValidator&lt;T&gt;</text>
  <text class="code" x="440" y="268" text-anchor="middle">FluentStyleValidator&lt;T&gt;</text>
  <text class="code" x="440" y="294" text-anchor="middle">Validate.For / Validate.Nested</text>
  <text class="code" x="440" y="320" text-anchor="middle" style="font-variant-ligatures: none">IValidator&lt;T&gt; -&gt; GuardResult</text>
  <text class="small" x="440" y="356" text-anchor="middle">ValueObject, Entity, AggregateRoot,</text>
  <text class="small" x="440" y="378" text-anchor="middle">business rules (14 languages),</text>
  <text class="small" x="440" y="400" text-anchor="middle">domain events</text>

  <!-- bus to the integration packages -->
  <text class="small" x="660" y="112">Integration packages, each named OrionGuard.&lt;name&gt;</text>
  <path class="flow" style="marker-end: none" d="M580,300 L620,300"/>
  <path class="flow" style="marker-end: none" d="M620,180 L620,520"/>
  <path class="flow" d="M620,180 L658,180"/>
  <path class="flow" d="M620,305 L658,305"/>
  <path class="flow" d="M620,425 L658,425"/>
  <path class="flow" d="M620,520 L658,520"/>

  <!-- request pipelines -->
  <rect class="step" x="660" y="130" width="500" height="100" rx="14"/>
  <text class="label" x="680" y="160">Request pipelines</text>
  <text class="small" x="840" y="160">validate before the handler runs</text>
  <text class="code" x="680" y="188">AspNetCore, MediatR, MassTransit, Hangfire</text>
  <text class="code" x="680" y="212">Grpc, SignalR, Blazor</text>

  <!-- domain events and outbox -->
  <rect class="step" x="660" y="245" width="500" height="120" rx="14"/>
  <text class="label" x="680" y="275">Domain events and outbox</text>
  <text class="small" x="880" y="275">dispatch on SaveChanges</text>
  <text class="code" x="680" y="303">EntityFrameworkCore, Outbox.Dashboard</text>
  <text class="code" x="680" y="327">Outbox.PostgresNotify, Outbox.SqlServerBroker</text>
  <text class="code" x="680" y="351">Locks.Redis</text>
  <text class="small" x="780" y="351">lease from OrionLock.Redis</text>

  <!-- observability -->
  <rect class="step" x="660" y="385" width="500" height="80" rx="14"/>
  <text class="label" x="680" y="415">Observability</text>
  <text class="code" x="680" y="443">OpenTelemetry, Aspire</text>
  <text class="small" x="880" y="443">meters, activity sources, health check</text>

  <!-- api schemas -->
  <rect class="step" x="660" y="480" width="500" height="80" rx="14"/>
  <text class="label" x="680" y="510">API schemas</text>
  <text class="code" x="680" y="538">Swagger, SchemaExport</text>
  <text class="small" x="880" y="538">attribute rules as schema constraints</text>

  <!-- build time and tests -->
  <rect class="note" x="40" y="480" width="540" height="170" rx="10"/>
  <text class="label" x="60" y="510">Build time and tests</text>
  <text class="code" x="60" y="538">Generators</text>
  <text class="small" x="170" y="538">[GenerateValidator]: validators without reflection</text>
  <text class="code" x="60" y="562">OpenApi</text>
  <text class="small" x="170" y="562">validators generated from an OpenAPI 3 schema</text>
  <text class="code" x="60" y="586">Migration</text>
  <text class="small" x="170" y="586">dotnet tool: FluentValidation to OrionGuard</text>
  <text class="code" x="60" y="610">Templates</text>
  <text class="small" x="170" y="610">dotnet new orionguard-webapi / orionguard-outbox</text>
  <text class="code" x="60" y="634">Testing</text>
  <text class="small" x="170" y="634">event capture, validator snapshots, rule coverage</text>
</svg>
